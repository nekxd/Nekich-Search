<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>Настройки поиска - Nekich Search</title>
    <link rel="shortcut icon" href="static/favicon.ico" type="image/x-icon">
    <link rel="icon" href="static/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" type="text/css" href="static/style.css">
</head>
<body>

    <div class="subpage-header">
        <a href="index.html">
            <img src="static/images/srpr/logo11w.png" width="120" height="44" alt="Google" style="border:0; vertical-align: middle;">
        </a>
        <span class="subpage-header-title">Настройки</span>
    </div>

    <div class="subpage-container">
        <div class="content-card">
            <h1 class="content-heading">Настройки поиска Nekich Search</h1>

            <div id="save-alert" style="display:none; background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; padding: 12px 16px; margin-bottom: 25px; border-radius: 2px;">
                <b>✓ Настройки успешно сохранены!</b>
            </div>

            <form id="settings-form" action="#" onsubmit="return saveSettings(event);">
                <div style="margin-bottom: 25px;">
                    <h3 style="font-size: 15px; color: #222; margin-bottom: 12px;">Отображение рекламы:</h3>
                    
                    <div style="margin-bottom: 10px;">
                        <label style="font-size: 14px; cursor: pointer;">
                            <input type="radio" name="ads_disabled" id="ads-on" value="0" checked>
                            Включить показ рекламы (рекомендуется)
                        </label>
                    </div>

                    <div>
                        <label style="font-size: 14px; cursor: pointer;">
                            <input type="radio" name="ads_disabled" id="ads-off" value="1">
                            Выключить рекламу в результатах поиска
                        </label>
                    </div>
                </div>

                <div style="margin-top: 30px;">
                    <input type="submit" value="Сохранить настройки" class="btn" style="background-color: #4285f4; color: #ffffff; border: 1px solid #4285f4; font-weight: bold; cursor: pointer; padding: 0 20px;">
                    <a href="index.html" class="btn" style="text-decoration:none; display:inline-block; line-height:36px; color:#444; margin-left: 10px;">Отмена</a>
                </div>
            </form>
        </div>
    </div>

    <div class="hp-footer" style="position:relative; margin-top:60px;">
        <div class="hp-footer-content">
            <div class="fl">
                <a href="about.html">О компании</a>
                <a href="advertising.html">Реклама</a>
                <a href="settings.html"><b>Настройки</b></a>
            </div>
            <div class="fr">
                <span>Nekich Search &copy; <span id="copy-year">2026</span></span>
            </div>
            <div class="clear"></div>
        </div>
    </div>

    <script type="text/javascript">
    (function() {
        // Dynamic Copyright
        var y = new Date().getFullYear();
        var copyEl = document.getElementById("copy-year");
        if (copyEl) {
            copyEl.innerText = (y > 2026) ? "2026-" + y : "2026";
        }

        // Load Saved Settings
        var adsDisabled = false;
        try {
            if (localStorage.getItem("ads_disabled") === "1") {
                adsDisabled = true;
            }
        } catch(e) {}
        if (document.cookie.indexOf("ads_disabled=1") !== -1) {
            adsDisabled = true;
        }

        if (adsDisabled) {
            document.getElementById("ads-off").checked = true;
        } else {
            document.getElementById("ads-on").checked = true;
        }
    })();

    function saveSettings(e) {
        if (e && e.preventDefault) e.preventDefault();
        
        var isOff = document.getElementById("ads-off").checked;
        var val = isOff ? "1" : "0";

        try {
            localStorage.setItem("ads_disabled", val);
        } catch(err) {}

        document.cookie = "ads_disabled=" + val + "; Path=/; Max-Age=31536000; SameSite=Lax";

        var alertBox = document.getElementById("save-alert");
        if (alertBox) {
            alertBox.style.display = "block";
            window.scrollTo(0, 0);
        }
        return false;
    }
    </script>
</body>
</html>

<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>ошибочка ^_^- Nekich Search</title>
    <link rel="shortcut icon" href="static/favicon.ico" type="image/x-icon">
    <link rel="icon" href="static/favicon.ico" type="image/x-icon">
    <style type="text/css">
        body {
            font-family: arial, sans-serif;
            margin: 50px auto;
            max-width: 600px;
            color: #222222;
            padding: 0 20px;
        }
        a { color: #1a0dab; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .error-code { font-size: 24px; margin-bottom: 10px; }
        .error-code b { font-weight: bold; }
        .error-code ins { color: #777777; text-decoration: none; }
        .error-desc { font-size: 14px; line-height: 1.6; color: #333333; }
        .error-desc ins { color: #777777; text-decoration: none; }
        .logo-box { margin-bottom: 30px; }
    </style>
</head>
<body>
    <div class="logo-box">
        <a href="index.html">
            <img src="static/images/srpr/logo11w.png" width="150" height="53" alt="ns" style="border:0;">
        </a>
    </div>

    <div class="error-code">
        <b>404.</b> <ins>Ошибочка >.<</ins>
    </div>

    <div class="error-desc">
        <p>Этот адрес <code id="bad-path">/not-found</code> не найден на этом сервере! <ins>Это все что мы знаем!</ins></p>
        <p><a href="index.html">&larr; Вернуться на главную страницу Nekich Search</a></p>
    </div>

    <script type="text/javascript">
        (function() {
            var el = document.getElementById("bad-path");
            if (el && window.location.pathname) {
                el.innerText = window.location.pathname;
            }
        })();
    </script>
</body>
</html>

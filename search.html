<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nekich Search</title>
    <link rel="shortcut icon" href="static/favicon.ico" type="image/x-icon">
    <link rel="icon" href="static/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" type="text/css" href="static/style.css">
</head>
<body>

    <!-- Search Header (No gbar, No tabs) -->
    <div class="search-header">
        <table class="header-table">
            <tr>
                <td class="header-logo-cell">
                    <a href="index.html">
                        <img src="static/images/srpr/logo11w.png" width="120" height="44" alt="Google" style="border:0;">
                    </a>
                </td>
                <td class="header-search-cell">
                    <form action="search.html" method="GET" style="margin:0; padding:0;">
                        <span class="search-form-wrap">
                            <input type="text" name="q" id="query-input" value="" class="search-input-header" maxlength="2048" autocomplete="off">
                            <button type="submit" class="search-btn-header" title="Поиск">
                                <svg viewBox="0 0 24 24" width="18" height="18" style="vertical-align: middle; fill: #ffffff;" aria-hidden="true">
                                    <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 14z"/>
                                </svg>
                            </button>
                        </span>
                    </form>
                </td>
            </tr>
        </table>
    </div>

    <!-- Results Section -->
    <div class="results-container">
        
        <div class="result-stats" id="result-stats">
            Загрузка результатов...
        </div>

        <table class="results-table">
            <tr>
                <!-- Left Column: Search Results -->
                <td class="results-left" id="results-left">
                    <div id="results-list">
                        <div style="margin-top: 20px; font-size: 14px; color: #666;">
                            Поиск по запросу...
                        </div>
                    </div>

                    <!-- Clean Numbered Pagination -->
                    <div class="clean-pagination" id="pagination" style="display:none;"></div>
                </td>

                <!-- Right Column: Structured Rotating Ad Banner (Баннер / Название / Описание) -->
                <td class="results-right" id="results-right">
                    <div class="ad-sidebar" id="ad-box">
                        <div class="ad-label-top">Реклама</div>
                        <!-- 1. Баннер -->
                        <div class="ad-banner-wrap">
                            <a id="banner-link" href="#" target="_blank">
                                <img id="banner-img" src="" alt="Реклама" class="ad-banner-img">
                            </a>
                        </div>
                        <!-- 2. Название -->
                        <div class="ad-title">
                            <a id="banner-title-link" href="#" target="_blank"></a>
                        </div>
                        <!-- 3. Описание -->
                        <div class="ad-desc" id="banner-desc"></div>
                    </div>
                </td>
            </tr>
        </table>

    </div>

    <!-- Footer -->
    <div class="search-footer">
        <div class="fl">
            <a href="about.html">О компании</a>
            <a href="advertising.html">Реклама</a>
            <a href="business.html">Для бизнеса</a>
            <a href="privacy.html">Конфиденциальность</a>
            <a href="terms.html">Условия</a>
            <a href="settings.html">Настройки</a>
        </div>
        <div class="fr">
            <span>Nekich Search &copy; <span id="copy-year">2026</span></span>
        </div>
        <div class="clear"></div>
    </div>

    <script type="text/javascript">
    (function() {
        // Dynamic Copyright
        var curYear = new Date().getFullYear();
        var copyEl = document.getElementById("copy-year");
        if (copyEl) {
            copyEl.innerText = (curYear > 2026) ? "2026-" + curYear : "2026";
        }

        // Banners Data (5 Rotating Banners with structured Name, Desc, Img, Target)
        var BANNERS = [
            {
                name: "Inori Aizawa",
                desc: "Официальный маскот Internet Explorer в Азии. Let's explore the web!",
                img_url: "http://faero.top/ad/inori.png",
                target_url: "http://inori.faero.top"
            },
            {
                name: "LunaStore",
                desc: "Лучший магазин приложений для старых ПК. Работает даже на Windows XP и IE6!",
                img_url: "http://faero.top/ad/ls_rek.png",
                target_url: "http://lunastore.app"
            },
            {
                name: "Renaissance",
                desc: "Классический мессенджер, основанный на легендарном движке Агента@Mail.RU.",
                img_url: "http://faero.top/ad/mrim.jpg",
                target_url: "http://mrim.su"
            },
            {
                name: "FaeroFM",
                desc: "Old hits. Good memories. Онлайн-радиостанция с лучшими хитами прошлых лет.",
                img_url: "http://faero.top/ad/faerofm.png",
                target_url: "http://fm.faero.top"
            },
            {
                name: "faero.top",
                desc: "Подари вторую жизнь своему браузеру из нулевых! Ретро-портал и каталог софта.",
                img_url: "http://faero.top/ad/faero.png",
                target_url: "http://faero.top"
            }
        ];

        // Parse Query Params
        function getParam(name) {
            var match = RegExp('[?&]' + name + '=([^&]*)').exec(window.location.search);
            return match ? decodeURIComponent(match[1].replace(/\+/g, ' ')) : null;
        }

        var q = getParam('q');
        var page = parseInt(getParam('p'), 10) || 1;
        var btnI = getParam('btnI');

        if (!q || q.trim() === "") {
            window.location.href = "index.html";
            return;
        }

        q = q.trim();
        document.title = q + " - Nekich Search";
        var inputEl = document.getElementById("query-input");
        if (inputEl) inputEl.value = q;

        var isHttps = (window.location.protocol === "https:");
        var httpProto = isHttps ? "https:" : "http:";

        // "Мне повезёт!" Auto-redirect
        if (btnI !== null) {
            window.location.href = httpProto + "//duckduckgo.com/?q=!+" + encodeURIComponent(q);
            return;
        }

        // Ads Handling
        var adsDisabled = false;
        try {
            if (localStorage.getItem("ads_disabled") === "1") {
                adsDisabled = true;
            }
        } catch(e) {}
        if (document.cookie.indexOf("ads_disabled=1") !== -1) {
            adsDisabled = true;
        }

        var resultsLeft = document.getElementById("results-left");
        var resultsRight = document.getElementById("results-right");
        if (adsDisabled) {
            if (resultsRight) resultsRight.style.display = "none";
            if (resultsLeft) resultsLeft.style.width = "750px";
        } else {
            var bIdx = Math.floor(Math.random() * BANNERS.length);
            var banner = BANNERS[bIdx];
            var bLink = document.getElementById("banner-link");
            var bImg = document.getElementById("banner-img");
            var bTitleLink = document.getElementById("banner-title-link");
            var bDesc = document.getElementById("banner-desc");
            if (bLink && bImg && bTitleLink && bDesc) {
                bLink.href = banner.target_url;
                bLink.title = banner.name;
                bImg.src = banner.img_url;
                bImg.alt = banner.name;
                bTitleLink.href = banner.target_url;
                bTitleLink.innerText = banner.name;
                bDesc.innerText = banner.desc;
            }
        }

        // Clean site URL helper (displays only site domain, no deep page paths)
        function cleanSiteUrl(url) {
            if (!url) return "";
            try {
                var a = document.createElement('a');
                a.href = url;
                var host = a.hostname || "";
                if (host.indexOf("www.") === 0) {
                    host = host.substring(4);
                }
                return host || url;
            } catch(e) {
                var m = url.match(/^https?:\/\/(?:www\.)?([^/?#]+)/i);
                return m ? m[1] : url;
            }
        }

        function getFaviconUrl(url) {
            if (!url) return "";
            var host = cleanSiteUrl(url);
            return httpProto + "//www.google.com/s2/favicons?domain=" + encodeURIComponent(host) + "&sz=16";
        }

        // Search Execution
        var startTime = new Date().getTime();

        function renderResults(items, zeroClick) {
            var elapsed = ((new Date().getTime() - startTime) / 1000).toFixed(2);
            var statsEl = document.getElementById("result-stats");
            var listEl = document.getElementById("results-list");

            var countApprox = (items.length * 14200 + Math.floor(Math.random() * 5000)).toLocaleString('ru-RU');
            if (statsEl) {
                statsEl.innerText = "Результатов: примерно " + countApprox + " (" + elapsed + " сек.)";
            }

            var html = "";

            if (zeroClick) {
                var zcFav = getFaviconUrl(zeroClick.url);
                var zcSite = cleanSiteUrl(zeroClick.url);
                html += '<div class="g" style="border: 1px solid #ebebeb; padding: 12px; background: #fafafa; margin-bottom: 25px;">';
                html += '<h3 class="r"><a href="' + escapeHtml(zeroClick.url) + '" target="_blank">' + escapeHtml(zeroClick.title) + '</a></h3>';
                html += '<div class="kv">';
                html += '<img src="' + escapeHtml(zcFav) + '" class="site-favicon" width="16" height="16" alt="" onerror="this.style.display=\'none\'">';
                html += '<cite>' + escapeHtml(zcSite) + '</cite>';
                html += '</div>';
                html += '<span class="st">' + zeroClick.snippet + '</span>';
                html += '</div>';
            }

            if (items.length > 0) {
                for (var i = 0; i < items.length; i++) {
                    var it = items[i];
                    var fav = getFaviconUrl(it.url);
                    var site = cleanSiteUrl(it.url);
                    html += '<div class="g">';
                    html += '<h3 class="r"><a href="' + escapeHtml(it.url) + '" target="_blank">' + escapeHtml(it.title) + '</a></h3>';
                    html += '<div class="kv">';
                    html += '<img src="' + escapeHtml(fav) + '" class="site-favicon" width="16" height="16" alt="" onerror="this.style.display=\'none\'">';
                    html += '<cite>' + escapeHtml(site) + '</cite>';
                    html += '</div>';
                    html += '<span class="st">' + it.snippet + '</span>';
                    html += '</div>';
                }
            } else {
                html += '<div style="margin-top: 20px; font-size: 14px;">';
                html += '<p>По запросу <b>' + escapeHtml(q) + '</b> ничего не найдено.</p>';
                html += '<p>Рекомендации:</p>';
                html += '<ul>';
                html += '<li>Убедитесь, что все слова написаны без ошибок.</li>';
                html += '<li>Попробуйте использовать другие ключевые слова.</li>';
                html += '<li>Попробуйте использовать более популярные ключевые слова.</li>';
                html += '</ul>';
                html += '<p style="margin-top:20px;"><a href="' + httpProto + '//duckduckgo.com/?q=' + encodeURIComponent(q) + '" target="_blank" class="btn" style="display:inline-block; line-height:34px; text-decoration:none;">Искать «' + escapeHtml(q) + '» в DuckDuckGo &rarr;</a></p>';
                html += '</div>';
            }

            // Fallback web search box
            if (items.length > 0) {
                html += '<div style="margin-top: 30px; padding: 15px; background: #f9f9f9; border: 1px solid #eee; border-radius: 2px;">';
                html += '<div style="font-weight: bold; margin-bottom: 8px; color: #444;">Искать на других поисковых системах:</div>';
                html += '<a href="' + httpProto + '//duckduckgo.com/?q=' + encodeURIComponent(q) + '" target="_blank" style="margin-right: 15px;">DuckDuckGo</a> ';
                html += '<a href="' + httpProto + '//www.google.com/search?q=' + encodeURIComponent(q) + '" target="_blank" style="margin-right: 15px;">Google</a> ';
                html += '<a href="' + httpProto + '//yandex.ru/search/?text=' + encodeURIComponent(q) + '" target="_blank">Яндекс</a>';
                html += '</div>';
            }

            if (listEl) listEl.innerHTML = html;

            // Pagination
            var paginationEl = document.getElementById("pagination");
            if (paginationEl && items.length > 0) {
                var totalPages = 5;
                var pagHtml = "";
                if (page > 1) {
                    pagHtml += '<a href="search.html?q=' + encodeURIComponent(q) + '&p=' + (page - 1) + '" class="page-nav-btn">&lt;&lt; Предыдущая</a> ';
                }
                for (var p = 1; p <= totalPages; p++) {
                    if (p === page) {
                        pagHtml += '<span class="page-active">' + p + '</span> ';
                    } else {
                        pagHtml += '<a href="search.html?q=' + encodeURIComponent(q) + '&p=' + p + '">' + p + '</a> ';
                    }
                }
                if (page < totalPages) {
                    pagHtml += '<a href="search.html?q=' + encodeURIComponent(q) + '&p=' + (page + 1) + '" class="page-nav-btn">Следующая &gt;&gt;</a>';
                }
                paginationEl.innerHTML = pagHtml;
                paginationEl.style.display = "block";
            }
        }

        function escapeHtml(str) {
            if (!str) return "";
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        // Web search without Wikipedia (Real websites and services)
        function performSearch() {
            var collectedResults = [];
            var zeroClick = null;
            var qLower = q.toLowerCase();

            // 1. Curated retro & popular web sites catalog
            var KNOWN_SITES = [
                { keys: ["faero.top", "faero", "faerofm", "fm.faero.top"], title: "faero.top - Подари вторую жизнь браузеру из нулевых!", url: "http://faero.top", snippet: "Ретро-портал, веб-сервисы и программы для старых браузеров и ПК." },
                { keys: ["faerofm", "fm.faero.top", "faero fm"], title: "FaeroFM - Old hits. Good memories.", url: "http://fm.faero.top", snippet: "Онлайн-радиостанция с лучшими хитами прошлых лет. Ретро-музыка и ностальгия." },
                { keys: ["inori", "aizawa", "inori aizawa"], title: "Inori Aizawa - Let's explore the web!", url: "http://inori.faero.top", snippet: "Официальный маскот Internet Explorer в Азии. Ретро-веб и браузерные приключения." },
                { keys: ["lunastore", "lunastore.app", "luna store"], title: "LunaStore - Каталог приложений для старых ПК", url: "http://lunastore.app", snippet: "Лучший магазин приложений для Windows XP и старых ПК. Работает даже на IE6." },
                { keys: ["mrim", "mrim.su", "renaissance", "агент", "agent"], title: "Мессенджер Renaissance", url: "http://mrim.su", snippet: "Классический мессенджер, основанный на легендарном движке Агента@Mail.RU." },
                { keys: ["soap", "soap.nekxd.fun", "mail.ru", "мейл"], title: "Ретро Mail.RU 2014", url: "http://soap.nekxd.fun", snippet: "Фановый реборн классического портала Mail.RU образца 2014 года." },
                { keys: ["nekxd", "nekxd.ru"], title: "Nekxd Projects", url: "http://nekxd.ru", snippet: "Проекты, эксперименты и ретро-сайты nekxd." },
                { keys: ["yandex", "яндекс", "ya.ru"], title: "Ретро Яндекс (nekxd)", url: "http://nekxd.ru/yandex", snippet: "Эксперимент с интерфейсом классического Яндекса." },
                { keys: ["ynd", "ynd.su"], title: "ynd.su - Обо мне", url: "http://ynd.su", snippet: "Персональный сайт разработчика Nekich Search." },
                { keys: ["vk", "vk.com", "вконтакте", "вк"], title: "ВКонтакте - добро пожаловать", url: "http://vk.com", snippet: "Универсальное средство для поиска друзей и одноклассников. Социальная сеть." },
                { keys: ["google", "гугл", "google.com"], title: "Google", url: "http://google.com", snippet: "Поисковая система Google. Быстрый поиск информации во всемирной паутине." },
                { keys: ["youtube", "ютуб", "youtube.com"], title: "YouTube", url: "http://youtube.com", snippet: "Крупнейший видеохостинг. Смотрите любимые видео и делитесь ими с друзьями." },
                { keys: ["github", "гитхаб", "github.com"], title: "GitHub - Build software better, together", url: "http://github.com", snippet: "Крупнейший веб-сервис для хостинга IT-проектов и совместной разработки ПО." },
                { keys: ["4pda", "4pda.to", "пда"], title: "4PDA - Всё о мобильных устройствах", url: "http://4pda.to", snippet: "Новости, обзоры, каталог программ и форум о мобильной технике." },
                { keys: ["old-dos", "olddos", "старые игры"], title: "Old-DOS.ru - Крупнейший архив старых программ", url: "http://old-dos.ru", snippet: "Архив старых программ для DOS, Windows 95, 98, 2000 и XP." },
                { keys: ["rutracker", "рутрекер"], title: "RuTracker.org", url: "http://rutracker.org", snippet: "Крупнейший русскоязычный битторрент-трекер." },
                { keys: ["habr", "хабр", "habrahabr"], title: "Хабр - Сообщество IT-специалистов", url: "http://habr.com", snippet: "Публикации об IT, программировании, дизайне, разработке и технологиях." }
            ];

            var matchedDirect = false;
            for (var k = 0; k < KNOWN_SITES.length; k++) {
                var entry = KNOWN_SITES[k];
                for (var ki = 0; ki < entry.keys.length; ki++) {
                    var key = entry.keys[ki];
                    if (qLower === key || qLower.indexOf(key) !== -1 || key.indexOf(qLower) !== -1) {
                        collectedResults.push({
                            title: entry.title,
                            url: entry.url,
                            display_url: cleanSiteUrl(entry.url),
                            snippet: entry.snippet
                        });
                        matchedDirect = true;
                        break;
                    }
                }
            }

            // 2. Direct domain / URL match
            if (/^[a-z0-9.-]+\.[a-z]{2,}(\/.*)?$/i.test(qLower)) {
                var cleanHost = qLower.split('/')[0];
                var directUrl = "http://" + qLower;
                collectedResults.push({
                    title: cleanHost + " - Официальный сайт",
                    url: directUrl,
                    display_url: cleanHost,
                    snippet: "Перейти на веб-сайт " + cleanHost + ". Прямой доступ к ресурсу."
                });
            }

            // 3. DuckDuckGo Instant Answer API (Official site links, NO Wikipedia)
            window.ddgCallback = function(data) {
                if (data) {
                    // Official site results
                    if (data.Results && data.Results.length > 0) {
                        for (var i = 0; i < data.Results.length; i++) {
                            var r = data.Results[i];
                            if (r.FirstURL && r.FirstURL.indexOf("wikipedia.org") === -1) {
                                collectedResults.push({
                                    title: r.Text || (cleanSiteUrl(r.FirstURL) + " - Официальный сайт"),
                                    url: r.FirstURL,
                                    display_url: cleanSiteUrl(r.FirstURL),
                                    snippet: "Официальный сайт " + cleanSiteUrl(r.FirstURL) + "."
                                });
                            }
                        }
                    }

                    // Zero-click box (only if NOT Wikipedia)
                    if (data.Heading && data.Abstract && data.AbstractURL && data.AbstractURL.indexOf("wikipedia.org") === -1) {
                        zeroClick = {
                            title: data.Heading,
                            url: data.AbstractURL,
                            snippet: data.Abstract
                        };
                    }

                    // Related external site topics (strictly NO Wikipedia)
                    if (data.RelatedTopics && data.RelatedTopics.length > 0) {
                        for (var j = 0; j < data.RelatedTopics.length; j++) {
                            var t = data.RelatedTopics[j];
                            if (t.Topics) {
                                for (var ti = 0; ti < t.Topics.length; ti++) {
                                    var sub = t.Topics[ti];
                                    if (sub.FirstURL && sub.FirstURL.indexOf("wikipedia.org") === -1 && sub.FirstURL.indexOf("wiktionary.org") === -1) {
                                        collectedResults.push({
                                            title: sub.Text ? sub.Text.split(' - ')[0] : cleanSiteUrl(sub.FirstURL),
                                            url: sub.FirstURL,
                                            display_url: cleanSiteUrl(sub.FirstURL),
                                            snippet: sub.Text || ("Сайт " + cleanSiteUrl(sub.FirstURL))
                                        });
                                    }
                                }
                            } else if (t.FirstURL && t.FirstURL.indexOf("wikipedia.org") === -1 && t.FirstURL.indexOf("wiktionary.org") === -1) {
                                collectedResults.push({
                                    title: t.Text ? t.Text.split(' - ')[0] : cleanSiteUrl(t.FirstURL),
                                    url: t.FirstURL,
                                    display_url: cleanSiteUrl(t.FirstURL),
                                    snippet: t.Text || ("Сайт " + cleanSiteUrl(t.FirstURL))
                                });
                            }
                        }
                    }
                }
                finishSearch();
            };

            var ddgScript = document.createElement("script");
            ddgScript.src = httpProto + "//api.duckduckgo.com/?q=" + encodeURIComponent(q) + "&format=json&callback=ddgCallback&no_html=1&skip_disambig=0";
            ddgScript.onerror = function() {
                finishSearch();
            };
            document.body.appendChild(ddgScript);

            function finishSearch() {
                // Deduplicate items by host / url
                var seen = {};
                var unique = [];
                for (var i = 0; i < collectedResults.length; i++) {
                    var item = collectedResults[i];
                    var uNorm = item.url.toLowerCase().replace(/^https?:\/\//, '').replace(/\/$/, '');
                    if (!seen[uNorm]) {
                        seen[uNorm] = true;
                        unique.push(item);
                    }
                }
                renderResults(unique, zeroClick);
            }

            // Fallback timeout
            setTimeout(function() {
                var listEl = document.getElementById("results-list");
                if (listEl && listEl.innerText.indexOf("Поиск по запросу") !== -1) {
                    finishSearch();
                }
            }, 3000);
        }

        performSearch();

    })();
    </script>
</body>
</html>

        function getParam(name) {
            var match = RegExp('[?&]' + name + '=([^&]*)').exec(window.location.search);
            return match ? decodeURIComponent(match[1].replace(/\+/g, ' ')) : null;
        }

        var q = getParam('q');

        if (!q || q.trim() === "") {
            window.location.href = "index.html";

        q = q.trim();

        var inputEl = document.getElementById("query-input");

        var isHttps = (window.location.protocol === "https:");

        // "Мне повезёт!" Auto-redirect

            window.location.href = httpProto + "//duckduckgo.com/?q=!+" + encodeURIComponent(q);

        // Clean site URL helper (displays only site domain, no deep page paths)
        function cleanSiteUrl(url) {
            if (!url) return "";
            try {
                var a = document.createElement('a');
                a.href = url;
                var host = a.hostname || "";
                if (host.indexOf("www.") === 0) {
                    host = host.substring(4);
                }
                return host || url;
            } catch(e) {
                var m = url.match(/^https?:\/\/(?:www\.)?([^/?#]+)/i);
                return m ? m[1] : url;
            }
        }

        function getFaviconUrl(url) {
            if (!url) return "";
            var host = cleanSiteUrl(url);
            return httpProto + "//www.google.com/s2/favicons?domain=" + encodeURIComponent(host) + "&sz=16";
        }

                html += '</div>';
            }

            if (items.length > 0) {
                html += '<div style="margin-top: 30px; padding: 15px; background: #f9f9f9; border: 1px solid #eee; border-radius: 2px;">';

                html += '<a href="' + httpProto + '//yandex.ru/search/?text=' + encodeURIComponent(q) + '" target="_blank">Яндекс</a>';
                html += '</div>';
            }

            if (listEl) listEl.innerHTML = html;

                    if (p === page) {
                        pagHtml += '<span class="page-active">' + p + '</span> ';
                    } else {
                        pagHtml += '<a href="search.html?q=' + encodeURIComponent(q) + '&p=' + p + '">' + p + '</a> ';
                    }

                if (page < totalPages) {
                    pagHtml += '<a href="search.html?q=' + encodeURIComponent(q) + '&p=' + (page + 1) + '" class="page-nav-btn">Следующая &gt;&gt;</a>';

                paginationEl.style.display = "block";

                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');

                // Portals & Social
                { keys: ["вконтакте", "вк", "vk", "vk.com"], title: "ВКонтакте — добро пожаловать", url: "http://vk.com", snippet: "Универсальное средство для поиска друзей и общения. Музыка, видео и сообщества." },
                { keys: ["telegram", "телеграм", "телега"], title: "Telegram — Безопасный мессенджер", url: "http://t.me", snippet: "Быстрый и удобный мессенджер с поддержкой каналов, групп и ботов." },
                { keys: ["yandex", "яндекс", "ya.ru"], title: "Яндекс — Поисковая система и портал", url: "http://ya.ru", snippet: "Поиск в Интернете, почта, карты, музыка, маркет и погода. Найдётся всё." },
                { keys: ["google", "гугл", "google.com"], title: "Google", url: "http://google.com", snippet: "Поисковая система Google. Быстрый поиск информации во всемирной паутине." },
                { keys: ["mail.ru", "мейл", "mail", "почта"], title: "Mail.ru — Почта, поиск и новости", url: "http://mail.ru", snippet: "Почтовый ящик, новости дня, игры, облако и медиапортал Mail.ru." },
                { keys: ["github", "гитхаб", "код"], title: "GitHub — Платформа для разработчиков", url: "http://github.com", snippet: "Хостинг IT-проектов, совместная разработка ПО и открытый исходный код." },
                { keys: ["habr", "хабр", "хабрахабр"], title: "Хабр — Сообщество IT-специалистов", url: "http://habr.com", snippet: "Публикации об IT, программировании, дизайне, разработке и технологиях." },
                { keys: ["погода", "гismeteo", "гисметео"], title: "Gismeteo — Прогноз погоды", url: "http://www.gismeteo.ru", snippet: "Точный прогноз погоды на сегодня, завтра и 14 дней в городах мира." }
            ];

            var matchedDirect = false;
            for (var k = 0; k < KNOWN_SITES.length; k++) {
                var entry = KNOWN_SITES[k];
                for (var ki = 0; ki < entry.keys.length; ki++) {
                    var key = entry.keys[ki];
                    if (qLower === key || qLower.indexOf(key) !== -1 || key.indexOf(qLower) !== -1) {
                        collectedResults.push({
                            title: entry.title,
                            url: entry.url,
                            display_url: cleanSiteUrl(entry.url),
                            snippet: entry.snippet
                        });
                        matchedDirect = true;
                        break;
                    }
                }
            }

            // 2. Direct domain / URL match
            if (/^[a-z0-9.-]+\.[a-z]{2,}(\/.*)?$/i.test(qLower)) {
                var cleanHost = qLower.split('/')[0];
                var directUrl = "http://" + qLower;
                collectedResults.push({
                    title: cleanHost + " - Официальный сайт",
                    url: directUrl,
                    display_url: cleanHost,
                    snippet: "Перейти на веб-сайт " + cleanHost + ". Прямой доступ к ресурсу."
                });
            }

            // 3. DuckDuckGo Instant Answer API (Official site links, NO Wikipedia)
            window.ddgCallback = function(data) {
                if (data) {
                    // Official site results
                    if (data.Results && data.Results.length > 0) {
                        for (var i = 0; i < data.Results.length; i++) {
                            var r = data.Results[i];
                            if (r.FirstURL && r.FirstURL.indexOf("wikipedia.org") === -1) {
                                collectedResults.push({
                                    title: r.Text || (cleanSiteUrl(r.FirstURL) + " - Официальный сайт"),
                                    url: r.FirstURL,
                                    display_url: cleanSiteUrl(r.FirstURL),
                                    snippet: "Официальный сайт " + cleanSiteUrl(r.FirstURL) + "."
                                });
                            }
                        }
                    }

                    // Zero-click box (only if NOT Wikipedia)
                    if (data.Heading && data.Abstract && data.AbstractURL && data.AbstractURL.indexOf("wikipedia.org") === -1) {
                        zeroClick = {
                            title: data.Heading,
                            url: data.AbstractURL,
                            snippet: data.Abstract
                        };
                    }

                    // Related external site topics (strictly NO Wikipedia)
                    if (data.RelatedTopics && data.RelatedTopics.length > 0) {
                        for (var j = 0; j < data.RelatedTopics.length; j++) {
                            var t = data.RelatedTopics[j];
                            if (t.Topics) {
                                for (var ti = 0; ti < t.Topics.length; ti++) {
                                    var sub = t.Topics[ti];
                                    if (sub.FirstURL && sub.FirstURL.indexOf("wikipedia.org") === -1 && sub.FirstURL.indexOf("wiktionary.org") === -1) {
                                        collectedResults.push({
                                            title: sub.Text ? sub.Text.split(' - ')[0] : cleanSiteUrl(sub.FirstURL),
                                            url: sub.FirstURL,
                                            display_url: cleanSiteUrl(sub.FirstURL),
                                            snippet: sub.Text || ("Сайт " + cleanSiteUrl(sub.FirstURL))
                                        });
                                    }
                                }
                            } else if (t.FirstURL && t.FirstURL.indexOf("wikipedia.org") === -1 && t.FirstURL.indexOf("wiktionary.org") === -1) {
                                collectedResults.push({
                                    title: t.Text ? t.Text.split(' - ')[0] : cleanSiteUrl(t.FirstURL),
                                    url: t.FirstURL,
                                    display_url: cleanSiteUrl(t.FirstURL),
                                    snippet: t.Text || ("Сайт " + cleanSiteUrl(t.FirstURL))
                                });
                            }
                        }
                    }
                }
                finishSearch();
            };

            var ddgScript = document.createElement("script");
            ddgScript.src = httpProto + "//api.duckduckgo.com/?q=" + encodeURIComponent(q) + "&format=json&callback=ddgCallback&no_html=1&skip_disambig=0";
            ddgScript.onerror = function() {
                finishSearch();
            };
            document.body.appendChild(ddgScript);

            function finishSearch() {
                var qEsc = encodeURIComponent(q);

                // 4. Always provide real Internet-wide search results from top engines
                var globalWebEngines = [
                    {
                        title: "Искать «" + q + "» в Яндексе",
                        url: httpProto + "//ya.ru/search/?text=" + qEsc,
                        display_url: "ya.ru",
                        snippet: "Найдётся всё. Поиск сайтов, картинок, новостей и видео во всем Интернете через Яндекс."
                    },
                    {
                        title: "Искать «" + q + "» в Google",
                        url: httpProto + "//www.google.com/search?q=" + qEsc,
                        display_url: "google.com",
                        snippet: "Быстрый поиск информации во всемирной паутине по запросу «" + q + "»."
                    },
                    {
                        title: "Искать «" + q + "» в DuckDuckGo",
                        url: httpProto + "//duckduckgo.com/?q=" + qEsc,
                        display_url: "duckduckgo.com",
                        snippet: "Конфиденциальный поиск сайтов во всемирной сети без отслеживания и сбора данных."
                    },
                    {
                        title: "Искать «" + q + "» в Microsoft Bing",
                        url: httpProto + "//www.bing.com/search?q=" + qEsc,
                        display_url: "bing.com",
                        snippet: "Глобальный поиск по веб-страницам, документам и сервисам интернета в Bing."
                    },
                    {
                        title: "Искать «" + q + "» в Поиск@Mail.RU",
                        url: httpProto + "//go.mail.ru/search?q=" + qEsc,
                        display_url: "mail.ru",
                        snippet: "Классический российский поиск по порталу и миллионам сайтов Рунета."
                    }
                ];

                for (var w = 0; w < globalWebEngines.length; w++) {
                    collectedResults.push(globalWebEngines[w]);
                }

                // Deduplicate items by host / url
                var seen = {};
                var unique = [];
                for (var i = 0; i < collectedResults.length; i++) {
                    var item = collectedResults[i];
                    var uNorm = item.url.toLowerCase().replace(/^https?:\/\//, '').replace(/\/$/, '');
                    if (!seen[uNorm]) {
                        seen[uNorm] = true;
                        unique.push(item);
                    }
                }
                renderResults(unique, zeroClick);
            }

            // Fallback timeout
            setTimeout(function() {
                var listEl = document.getElementById("results-list");
                if (listEl && listEl.innerText.indexOf("Поиск по запросу") !== -1) {
                    finishSearch();
                }
            }, 3000);
        }

        performSearch();

    })();
    </script>
</body>
</html>

</head>
<body class="hp-body">

    <div class="hp-main">
        <div>
            <a href="index.html">
                <img src="static/images/srpr/logo11w.png" width="269" height="95" alt="Google" class="hp-logo">
            </a>
        </div>
        
        <form action="search.html" method="GET" name="f">
            <div class="hp-search-box-wrap">
                <input type="text" name="q" class="hp-search-input" maxlength="2048" autocomplete="off" autofocus>
                
                <div class="hp-buttons">
                    <input type="submit" name="btnG" value="Поиск" class="btn">
                    <input type="submit" name="btnI" value="Мне повезёт!" class="btn">
                </div>
            </div>
        </form>
    </div>

    <div class="hp-footer">
        <div class="hp-footer-content">
            <div class="fl">

                <a href="terms.html">Условия</a>
                <a href="settings.html">Настройки</a>
                <span style="margin-left: 15px; color: #888;">&copy; <span id="copy-year">2026</span> Nekich Search</span>
            </div>
            <div class="clear"></div>
        </div>
    </div>

    <script type="text/javascript">
        (function() {
            var y = new Date().getFullYear();
            var el = document.getElementById("copy-year");
            if (el) {
                el.innerText = (y > 2026) ? "2026-" + y : "2026";
            }
        })();

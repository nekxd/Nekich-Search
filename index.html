<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сайт закрыт - Nekich Search</title>
    <link rel="shortcut icon" href="static/favicon.ico" type="image/x-icon">
    <link rel="icon" href="static/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" type="text/css" href="static/style.css">
</head>
<body class="hp-body">

    <div class="hp-main">
        <div>
            <a href="index.html">
                <img src="static/images/srpr/logo11w.png" width="269" height="95" alt="Google" class="hp-logo">
            </a>
        </div>

        <div class="closed-box">
            <div class="closed-status">
                <b>Сайт закрыт.</b> <ins>Проект завершён</ins>
            </div>

            <div class="closed-desc">
                <p>Поисковая система <b>Nekich Search</b> закрыта.</p>
                <p class="closed-subtext">Спасибо всем пользователям за поддержку и то, что были с нами!</p>
                <p class="closed-ins"><ins>Это все, что мы знаем.</ins></p>
            </div>

            <div class="closed-actions">
                <button type="button" id="music-btn" class="btn music-btn" onclick="toggleMusic()">&#9835; Включить музыку</button>
                <a href="home.html" class="btn" style="text-decoration:none; display:inline-block; line-height:34px; color:#5F6368;">Архив поиска &rarr;</a>
            </div>
        </div>
    </div>

    <!-- Background Audio: nekxd.ru/bg.m4a -->
    <audio id="bg-audio" loop preload="auto">
        <source src="//nekxd.ru/bg.m4a" type="audio/mp4">
        <source src="http://nekxd.ru/bg.m4a" type="audio/mp4">
    </audio>

    <!--[if IE]>
    <bgsound id="ie-bgsound" src="http://nekxd.ru/bg.m4a" loop="-1">
    <![endif]-->

    <div class="hp-footer">
        <div class="hp-footer-content">
            <div class="fl">
                <a href="about.html">О компании</a>
                <a href="advertising.html">Реклама</a>
                <a href="business.html">Для бизнеса</a>
            </div>
            <div class="fr">
                <a href="privacy.html">Конфиденциальность</a>
                <a href="terms.html">Условия</a>
                <a href="settings.html">Настройки</a>
                <span style="margin-left: 15px; color: #888;">&copy; <span id="copy-year">2026</span> Nekich Search</span>
            </div>
            <div class="clear"></div>
        </div>
    </div>

    <script type="text/javascript">
        // Dynamic copyright
        (function() {
            var y = new Date().getFullYear();
            var el = document.getElementById("copy-year");
            if (el) {
                el.innerText = (y > 2026) ? "2026-" + y : "2026";
            }
        })();

        // Background music player
        var audio = document.getElementById("bg-audio");
        var musicBtn = document.getElementById("music-btn");
        var isPlaying = false;

        function updateMusicButton(playing) {
            isPlaying = playing;
            if (musicBtn) {
                musicBtn.innerHTML = playing ? "&#10074;&#10074; Пауза" : "&#9835; Включить музыку";
            }
        }

        function toggleMusic() {
            if (!audio) return;
            if (audio.paused) {
                var p = audio.play();
                if (p !== undefined) {
                    p.then(function() {
                        updateMusicButton(true);
                    }).catch(function(err) {
                        console.log("Play failed:", err);
                    });
                } else {
                    updateMusicButton(true);
                }
            } else {
                audio.pause();
                updateMusicButton(false);
            }
        }

        // Try autoplay on load
        if (audio) {
            audio.volume = 0.75;
            var playPromise = audio.play();
            if (playPromise !== undefined) {
                playPromise.then(function() {
                    updateMusicButton(true);
                }).catch(function() {
                    // Browser prevented unmuted autoplay; start on first interaction
                    updateMusicButton(false);
                    function startOnFirstTouch() {
                        if (audio.paused) {
                            audio.play().then(function() {
                                updateMusicButton(true);
                            }).catch(function() {});
                        }
                        document.removeEventListener("click", startOnFirstTouch);
                        document.removeEventListener("keydown", startOnFirstTouch);
                        document.removeEventListener("touchstart", startOnFirstTouch);
                    }
                    document.addEventListener("click", startOnFirstTouch);
                    document.addEventListener("keydown", startOnFirstTouch);
                    document.addEventListener("touchstart", startOnFirstTouch);
                });
            }
        }
    </script>
</body>
</html>

<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сайт закрыт - Nekich Search</title>
    <link rel="shortcut icon" href="static/favicon.ico" type="image/x-icon">
    <link rel="icon" href="static/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" type="text/css" href="static/style.css">
</head>
<body class="hp-body">

    <div class="hp-main">
        <div>
            <a href="index.html">
                <img src="static/images/srpr/logo11w.png" width="269" height="95" alt="Google" class="hp-logo">
            </a>
        </div>

        <div class="closed-box">
            <div class="closed-status">
                <b>Сайт закрыт.</b> <ins>Проект завершён</ins>
            </div>

            <div class="closed-desc">
                <p>Поисковая система <b>Nekich Search</b> закрыта.</p>
                <p>Спасибо всем, кто поддерживал наш проект, но к сожелению, все силы ушли на Soap.</p>
                <p>Всем удачи, заходите на <a href="http://soap.nekxd.fun" style="color: #1a0dab; text-decoration: underline;">Soap</a>.</p>
                <p class="closed-ins"><ins>Это всё что мы знаем.</ins></p>
            </div>

            <div class="closed-actions">
                <a href="http://soap.nekxd.fun" class="btn" style="text-decoration:none; display:inline-block; line-height:34px; color:#1a0dab; font-weight:bold; font-size:14px; padding:0 20px;">Перейти на Soap &rarr;</a>
            </div>
        </div>
    </div>

    <!-- Background Audio: nekxd.ru/bg.m4a (Looping / On Repeat) -->
    <audio id="bg-audio" loop preload="auto" autoplay>
        <source src="//nekxd.ru/bg.m4a" type="audio/mp4">
        <source src="http://nekxd.ru/bg.m4a" type="audio/mp4">
    </audio>

    <!--[if IE]>
    <bgsound id="ie-bgsound" src="http://nekxd.ru/bg.m4a" loop="-1">
    <![endif]-->

    <script type="text/javascript">
        // Automatic background music on repeat
        (function() {
            var audio = document.getElementById("bg-audio");
            if (!audio) return;

            audio.volume = 0.75;
            audio.loop = true;

            // Ensure repeating across all browsers
            audio.addEventListener("ended", function() {
                audio.currentTime = 0;
                audio.play();
            }, false);

            function tryPlay() {
                var p = audio.play();
                if (p !== undefined) {
                    p.catch(function() {
                        // If browser blocks unmuted autoplay, play on first interaction
                        function startAudio() {
                            audio.play();
                            document.removeEventListener("click", startAudio);
                            document.removeEventListener("keydown", startAudio);
                            document.removeEventListener("touchstart", startAudio);
                        }
                        document.addEventListener("click", startAudio);
                        document.addEventListener("keydown", startAudio);
                        document.addEventListener("touchstart", startAudio);
                    });
                }
            }

            tryPlay();
        })();
    </script>
</body>
</html>

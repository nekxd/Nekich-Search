<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>Nekich Search</title>
    <link rel="shortcut icon" href="/static/favicon.ico" type="image/x-icon">
    <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" type="text/css" href="/static/style.css">
</head>
<body class="hp-body">

    <div class="hp-main">
        <div>
            <a href="/">
                <img src="/static/images/srpr/logo11w.png" width="269" height="95" alt="Google" class="hp-logo">
            </a>
        </div>
        
        <form action="/search" method="GET" name="f">
            <div class="hp-search-box-wrap">
                <input type="text" name="q" class="hp-search-input" maxlength="2048" autocomplete="off" autofocus>
                
                <div class="hp-buttons">
                    <input type="submit" name="btnG" value="Поиск" class="btn">
                    <input type="submit" name="btnI" value="Мне повезёт!" class="btn">
                </div>
            </div>
        </form>
    </div>

    <div class="hp-footer">
        <div class="hp-footer-content">
            <div class="fl">
                <a href="/about">О компании</a>
                <a href="/advertising">Реклама</a>
                <a href="/business">Для бизнеса</a>
            </div>
            <div class="fr">
                <a href="/privacy">Конфиденциальность</a>
                <a href="/terms">Условия</a>
                <a href="/settings">Настройки</a>
                <span style="margin-left: 15px; color: #888;">&copy; {{ copyright_years }} Nekich Search</span>
            </div>
            <div class="clear"></div>
        </div>
    </div>

</body>
</html>
